<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="products.js"></script>
<title>yasshop12 – Catalogo digitale uomo e donna</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* ===== Stile "Cromo Notte" ===== */
:root{--bg:#07080d;--bg2:#0d1120;--sf:rgba(255,255,255,.045);--sf2:#121626;--ink:#f2f5fb;--mut:#9aa4ba;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
--ac:#3b6cff;--ac2:#7b5cff;--acl:#9fb8ff;--ok:#5fd394;--no:#ff8f8f;
--grad:linear-gradient(135deg,#7aa2ff 0%,#3b6cff 50%,#7b5cff 100%);
--chrome:linear-gradient(180deg,#fff 0%,#e8ecf3 38%,#8d96a8 52%,#f4f6fa 70%,#b9c0cc 100%);
--head:"Syne","Helvetica Neue",Arial,sans-serif;--body:"Manrope","Helvetica Neue",Arial,sans-serif;
--ease:cubic-bezier(.2,.8,.2,1);
--sh:0 24px 50px -16px rgba(0,0,0,.85),0 8px 18px -6px rgba(0,0,0,.5);
--glow:0 22px 50px -14px rgba(59,108,255,.55);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
/* aurora di sfondo che si muove piano */
body::after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 30% at 20% 18%,rgba(59,108,255,.22),transparent 70%),radial-gradient(34% 28% at 82% 30%,rgba(123,92,255,.18),transparent 70%),radial-gradient(40% 30% at 55% 88%,rgba(40,70,160,.18),transparent 70%);animation:aurora 26s ease-in-out infinite alternate;will-change:transform}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(4%,-3%,0) rotate(6deg)}100%{transform:translate3d(-4%,3%,0) rotate(-4deg)}}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid var(--acl);outline-offset:3px;border-radius:8px}
::selection{background:rgba(59,108,255,.45)}

/* ===== Barra in alto ===== */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,8,13,.72);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.tb::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(159,184,255,.55),transparent);opacity:.7}
.tb>div{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:18px;align-items:center}
.tb>div>.logo{margin-right:auto}.tb>div[hidden]{display:none}
/* logo cromato con riflesso che passa */
.logo{position:relative;font-family:"Unbounded",var(--head);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.15;padding:2px 0 4px;text-decoration:none;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) no-repeat,var(--chrome);background-size:300% 100%,100% 100%;background-position:150% 0,0 0;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 #5c6370) drop-shadow(0 2px 0 #3a3f48) drop-shadow(0 3px 0 #23262c) drop-shadow(0 0 10px rgba(170,200,255,.5));animation:logoShine 7s var(--ease) 1.2s infinite}
@keyframes logoShine{0%,72%{background-position:150% 0,0 0}100%{background-position:-50% 0,0 0}}
.lb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--ink);transition:border-color .25s,color .25s,background .25s,transform .2s var(--ease)}
.lb:active{transform:scale(.94)}
.lb[aria-expanded="true"]{border-color:var(--acl);color:var(--acl);background:rgba(59,108,255,.12)}
.tb a.l{color:var(--mut);text-decoration:none;font-size:15px;font-weight:600;position:relative;padding:8px 2px;transition:color .2s}
.tb a.l::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;border-radius:2px;background:var(--grad);transform:scaleX(0);transition:transform .3s var(--ease)}
.sp{animation:drop .3s var(--ease)}
.sp .si{flex:1;padding:13px 20px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.06);font-size:16px;transition:border-color .2s,box-shadow .2s}
.sp .si:focus{outline:none;border-color:var(--acl);box-shadow:0 0 0 4px rgba(59,108,255,.2)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}

/* ===== Home ===== */
.hero2{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;padding:20px 20px 22px;height:calc(100svh - 69px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:540px;background:radial-gradient(ellipse 65% 50% at 50% 42%,rgba(60,90,180,.28),transparent 70%),linear-gradient(165deg,#07080d 0%,#141a2c 45%,#07080d 100%)}
.hero2 .hbg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;animation:kenburns 18s ease-out forwards}
.hero2.has-img::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,8,13,.62) 0%,rgba(7,8,13,.35) 38%,rgba(7,8,13,.55) 70%,rgba(7,8,13,.96) 100%),radial-gradient(ellipse 80% 60% at 50% 45%,rgba(25,45,110,.32),rgba(7,8,13,.4) 75%)}
@keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1)}}
.orb{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;mix-blend-mode:screen;animation:float 14s ease-in-out infinite alternate}
.orb.o1{width:60vmax;height:60vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,rgba(59,108,255,.30),transparent 62%)}
.orb.o2{width:50vmax;height:50vmax;right:-22vmax;bottom:-18vmax;background:radial-gradient(circle,rgba(123,92,255,.28),transparent 62%);animation-duration:18s;animation-direction:alternate-reverse}
@keyframes float{to{transform:translate3d(6vmax,4vmax,0)}}
.hc{margin:auto 0;display:flex;flex-direction:column;align-items:center;padding-bottom:4vh}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(10,13,24,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d6def0;margin-bottom:18px;opacity:0;animation:catSub .8s var(--ease) .1s forwards}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--acl);box-shadow:0 0 10px var(--acl);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* scritta CATALOGO animata con contorno luminoso */
.hero2 h1.cat{font:800 clamp(34px,8.6vw,104px)/1.05 var(--head);letter-spacing:.08em;text-transform:uppercase;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:2px #fff;display:flex;justify-content:center;white-space:nowrap;position:relative;padding:.08em .1em;margin:0 0 10px;filter:drop-shadow(0 0 6px rgba(190,210,255,.6)) drop-shadow(0 0 20px rgba(91,134,255,.5));animation:catGlow 3.6s ease-in-out 2.4s infinite}
.hero2 h1.cat span{display:inline-block;opacity:0;animation:catRise 1.1s var(--ease) forwards;animation-delay:calc(var(--i)*.1s + .3s)}
.hero2 h1.cat::after{content:attr(data-t);position:absolute;inset:0;padding:inherit;letter-spacing:inherit;-webkit-text-stroke:0;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.95) 48%,rgba(159,184,255,.9) 52%,transparent 60%) no-repeat;background-size:300% 100%;background-position:160% 0;-webkit-background-clip:text;background-clip:text;pointer-events:none;animation:catSweep 6s var(--ease) 1.5s infinite}
.hero2 h1.cat~.sub{opacity:0;animation:catSub .9s var(--ease) 1.3s forwards}
.hero2 .sub{font-size:clamp(13px,1.8vw,16px);font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#c9d2e4;margin:0}
@keyframes catRise{0%{opacity:0;transform:translateY(60%) scale(.9) rotateX(60deg);filter:blur(12px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes catSweep{0%{background-position:160% 0}35%,100%{background-position:-60% 0}}
@keyframes catSub{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes catGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(190,210,255,.6)) drop-shadow(0 0 20px rgba(91,134,255,.5))}50%{filter:drop-shadow(0 0 10px rgba(215,228,255,.9)) drop-shadow(0 0 34px rgba(91,134,255,.8))}}
.hero2 .cta{margin-top:30px;opacity:0;animation:catSub .9s var(--ease) 1.55s forwards}
.qc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:4px 2px;margin-top:auto;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);opacity:0;animation:catSub .9s var(--ease) 1.8s forwards}
.qc::-webkit-scrollbar{display:none}
.qc a{flex:0 0 auto;padding:10px 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(10,13,24,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-decoration:none;font-size:14px;font-weight:600;color:#dfe5f2;transition:background .25s,border-color .25s,transform .2s var(--ease)}
.qc a:first-child{margin-left:18px}.qc a:last-child{margin-right:18px}
.qc a:active{transform:scale(.95)}
.scene{display:none}.home footer{display:none}

/* ===== Pulsanti ===== */
.cta,.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:52px;padding:15px 34px;border-radius:999px;border:0;background:var(--grad);color:#fff;font:700 17px var(--body);letter-spacing:.01em;text-decoration:none;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s var(--ease),box-shadow .25s}
.cta::after,.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.cta:active,.btn:active{transform:scale(.97)}
.hero2.has-img .cta,.hero2 .cta{background:linear-gradient(180deg,#fff,#d9dfeb);color:#0a0c14;box-shadow:0 16px 40px -10px rgba(91,134,255,.7),inset 0 1px 0 #fff}
.cta svg,.btn svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.btn.g{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--line2)}

/* ===== Pagine interne ===== */
.wrap{max-width:1240px;margin:0 auto;padding:34px 20px 70px}
.sec{font:700 clamp(30px,4.6vw,48px)/1.05 var(--head);letter-spacing:-.02em;margin:0 0 22px;background:linear-gradient(180deg,#fff 30%,#a9b3c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;margin-bottom:14px;font-weight:600;font-size:15px;padding:6px 0;transition:color .2s,gap .25s var(--ease)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tile{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:var(--sh);text-decoration:none;color:#fff;background:linear-gradient(160deg,#1a2033,#0b0d15);transition:transform .4s var(--ease),box-shadow .4s}
.tile::before{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 40%,rgba(159,184,255,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:opacity .3s}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.tile span{position:absolute;inset:auto 0 0;padding:52px 18px 16px;background:linear-gradient(transparent,rgba(5,7,14,.55) 35%,rgba(5,7,14,.92))}
.tile b{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 22px/1.15 var(--head);letter-spacing:-.01em}
.tile b::after{content:"→";flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--body);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);transition:background .3s,transform .3s var(--ease)}
.tile small{color:#c6cede;font-size:13px;font-weight:500}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px;align-items:center}
.fg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.fg>span{color:var(--mut);font-size:14px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 16px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.05);font-size:15px;font-weight:600;transition:background .25s,border-color .25s,transform .2s var(--ease),box-shadow .25s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"],.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 24px -10px rgba(59,108,255,.8)}
.dd{position:relative}.dd summary{list-style:none;cursor:pointer}.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg);margin-left:4px;transition:transform .25s var(--ease)}
.dd[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.ddm{position:absolute;z-index:15;top:calc(100% + 10px);left:0;min-width:210px;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:rgba(16,20,34,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--sh);animation:pop .25s var(--ease);transform-origin:top left}
.ddm .chip{justify-content:flex-start;text-align:left;border-radius:12px;border-color:transparent;background:transparent}
.ddm .chip[aria-pressed="true"]{background:var(--grad)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.cnt{color:var(--mut);font-size:14px;font-weight:600;margin:0 0 18px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 20px}
.card{text-decoration:none;display:block}
.card .im{aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:#fff;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.08),var(--sh);transition:transform .4s var(--ease),box-shadow .4s}
.card img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .7s var(--ease)}
.card .im.fit{background:#fff}.card .im.fit img{object-fit:contain}
.tag{position:absolute;left:10px;top:10px;background:rgba(10,12,20,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--no);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.card b{display:block;margin-top:12px;font-weight:700;font-size:15px;line-height:1.3}.card small{color:var(--mut);font-size:13px;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #fff4}
.empty{color:var(--mut);padding:40px 24px;text-align:center;border:1px dashed var(--line2);border-radius:20px;background:var(--sf)}

/* ===== Scheda prodotto ===== */
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:start}
.main{aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.1),var(--sh),0 40px 80px -30px rgba(59,108,255,.35)}
.main img{width:100%;height:100%;object-fit:contain;display:block}
.gal{position:relative}.sl{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.sl::-webkit-scrollbar{display:none}.sl img{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#0b0d14;font:500 30px/1 var(--body);display:grid;place-items:center;padding-bottom:3px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);z-index:2;transition:opacity .3s,transform .25s var(--ease)}
.ar:active{transform:translateY(-50%) scale(.9)}.ar.l{left:12px}.ar.r{right:12px}.ar[disabled]{opacity:0;pointer-events:none}
.gcnt{position:absolute;right:14px;bottom:14px;background:rgba(10,12,20,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;z-index:2;font-variant-numeric:tabular-nums}
.th{display:flex;gap:10px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding:4px}.th::-webkit-scrollbar{display:none}
.th button{flex:0 0 calc(25% - 7.5px);padding:0;border:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:#fff;opacity:.55;box-shadow:0 0 0 1px rgba(255,255,255,.1);transition:opacity .25s,box-shadow .25s,transform .25s var(--ease)}
.th button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acl),0 8px 20px -6px rgba(59,108,255,.6)}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.info{display:flex;flex-direction:column;gap:16px;position:sticky;top:96px}
.info h1{font:700 clamp(28px,4vw,44px)/1.08 var(--head);letter-spacing:-.02em;margin:0;text-align:left;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.price{font:700 28px var(--head)}
.ok,.no{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
.ok{color:var(--ok);background:rgba(95,211,148,.1);border:1px solid rgba(95,211,148,.25)}.no{color:var(--no);background:rgba(255,143,143,.1);border:1px solid rgba(255,143,143,.25)}
.ok::before,.no::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.lab{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.info>.lab:first-child{color:var(--acl);margin:0}
.info .desc{margin:0;color:#c3cad8;font-size:16px}
.info>.btn{width:100%;margin-top:4px}
.panel{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh);animation:pop .35s var(--ease)}
.panel .lab{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;margin:0}
.tgi{width:100%;padding:13px 16px;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:14px;font-size:16px;transition:border-color .2s,box-shadow .2s}
.panel textarea{width:100%;min-height:100px;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:14px;padding:13px 16px;resize:none;font-size:16px;line-height:1.5}
.tgi:focus,.panel textarea:focus{outline:none;border-color:var(--acl);box-shadow:0 0 0 4px rgba(59,108,255,.2)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 auto;padding:13px 22px;font-size:16px}
.more{font-size:clamp(24px,3vw,32px)!important;margin-top:64px!important}
footer{position:relative;border-top:1px solid var(--line);padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:14px}
footer b{display:block;margin-bottom:6px;font:800 18px "Unbounded",var(--head);color:transparent;background:var(--chrome);-webkit-background-clip:text;background-clip:text}

/* effetti al passaggio del mouse (solo dove c'è il mouse, non su iPad/telefono) */
@media (hover:hover){
.lb:hover{border-color:var(--acl);color:var(--acl)}
.tb a.l:hover{color:var(--ink)}.tb a.l:hover::after{transform:scaleX(1)}
.cta:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 26px 54px -14px rgba(59,108,255,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.cta:hover::after,.btn:hover::after{transform:translateX(120%)}.cta:hover svg,.btn:hover svg{transform:translateX(3px)}

function cat(c){cur=()=>cat(c);

 document.title="Cerca – yasshop12"}
